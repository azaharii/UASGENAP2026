<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Manajemen Inventaris Gudang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>📦 Manajemen Inventaris Gudang</2  >
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
  <h2>📦 Manajemen Inventaris Gudang</h2>
  <button type="button" id="btn-logout" class="btn btn-delete" style="padding: 8px 15px; font-size: 0.9rem;">
    <i class="fa-solid fa-right-from-bracket"></i> Keluar (Logout)
  </button>
</div>

    <div class="card">
      <h3 id="form-title">Tambah Barang Baru</h3>
      <form id="inventory-form">
        <input type="hidden" id="item-id">
        
        <div class="form-group">
          <label for="kode-barang">Kode Barang</label>
          <input type="text" id="kode-barang" required placeholder="Contoh: BRG001">
        </div>

        <div class="form-group">
          <label for="nama-barang">Nama Barang</label>
          <input type="text" id="nama-barang" required placeholder="Contoh: Laptop Asus">
        </div>

        <div class="form-group">
          <label for="kategori">Kategori</label>
          <select id="kategori" required>
            <option value="" disabled selected>-- Pilih Kategori --</option>
            <option value="Elektronik">Elektronik</option>
            <option value="Alat Tulis">Alat Tulis</option>
            <option value="Makanan">Makanan</option>
            <option value="Minuman">Minuman</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="jumlah-stok">Jumlah Stok</label>
            <input type="number" id="jumlah-stok" min="0" required placeholder="0">
          </div>
          
          <div class="form-group">
            <label for="harga-satuan">Harga Satuan (Rp)</label>
            <input type="number" id="harga-satuan" min="0" required placeholder="Contoh: 50000">
          </div>
        </div>

        <div class="form-buttons">
          <button type="submit" id="btn-submit" class="btn btn-primary">Simpan Barang</button>
          <button type="button" id="btn-cancel" class="btn btn-secondary" style="display: none;">Batal Edit</button>
        </div>
      </form>
    </div>

    <div class="card table-container">
      <h3>Daftar Stok Barang</h3>
      <table>
        <thead>
          <tr>
            <th>Kode</th>
            <th>Nama Barang</th>
            <th>Kategori</th>
            <th>Stok</th>
            <th>Harga Satuan</th>
            <th>Total Nilai</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="inventory-table-body">
          <tr>
            <td colspan="7" style="text-align: center; color: #888;">Memuat data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { logout } from './main.js';

    // 1. Proteksi Halaman: Jika belum login, tendang kembali ke login.html
    if (localStorage.getItem("isLogin2") !== "true") {
      window.location.href = "login.html";
    }

    // 2. Fitur Logout: Pastikan DOM sudah siap sebelum memasang Event Listener
    document.addEventListener("DOMContentLoaded", () => {
      const tombolLogout = document.getElementById('btn-logout');
      
      if (tombolLogout) {
        tombolLogout.addEventListener('click', (e) => {
          e.preventDefault();
          if (confirm("Apakah Anda yakin ingin keluar dari sistem?")) {
            logout();
          }
        });
      }
    });
  </script>
</body>
</html>

  </script>
  </body>
  
  </html>
</body>
</html>
